name: Windows (i386/x86_64/armv7/aarch64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-i386:
    runs-on: ubuntu-latest
    name: mingw32-i386
    env:
      # SDL2-devel-2.32.10-mingw.tar.gz
      SDL_VERSION: 2.32.10
      SDL_SHA256: 83a5d74012311edc3c0d40ea6faecbe57ad692aa033fa5dc273cc937e3938ff2
      # SDL-devel-1.2.15-mingw32.tar.gz
      SDL12_VERSION: 1.2.15
      SDL12_SHA256: d51eedfe7e07893d6c93a2d761c6ccc91d04b5f68a2ecabdbef83b7a1fef9cde
      FLAC_VERSION: 1.5.0
      FLAC_SHA256: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920
      LIBOGG_VERSION: 1.3.6
      LIBOGG_SHA256: 5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061
      UTF8PROC_VERSION: 2.10.0
      UTF8PROC_SHA256: 276a37dc4d1dd24d7896826a579f4439d1e5fe33603add786bb083cab802e23e
      MINGW_LITE_VERSION: 16.2.0-r1
      MINGW_LITE_SHA256: 91a28c5b1760cb6cc63550422caf29a88e31a0ab91425ce5e52601a73cd5671f
    steps:
      - name: 'Install dependencies'
        run: |
          sudo apt-get install rsync dos2unix

      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          path: schism

      - name: 'Retrieve runner temp directory'
        id: paths
        run: |
          mkdir "$RUNNER_TEMP/i386prefix" "$RUNNER_TEMP/mingw_lite"
          echo "prefix=$RUNNER_TEMP/i386prefix" >> $GITHUB_OUTPUT
          echo "mingw_lite=$RUNNER_TEMP/mingw_lite" >> $GITHUB_OUTPUT

      - name: 'Cache MinGW'
        id: cache-i386-mingw
        uses: actions/cache@v4
        with:
          path: '${{ steps.paths.outputs.mingw_lite }}'
          key: mingw32-i386-install-${{ env.MINGW_LITE_VERSION }}-${{ env.MINGW_LITE_SHA256 }}

      - name: 'Cache dependencies'
        id: cache-i386-dependencies
        uses: actions/cache@v4
        with:
          path: '${{ steps.paths.outputs.prefix }}'
          key: mingw32-i386-dependencies-SDL12_${{ env.SDL12_VERSION }}-SDL2_${{ env.SDL2_VERSION }}-FLAC_${{ env.FLAC_VERSION }}-LIBOGG_${{ env.LIBOGG_VERSION }}-UTF8PROC_${{ env.UTF8PROC_VERSION }}

        # grab a (quite old) version of mingw32 so that we can
        # target extremely old Windows versions that mingw-w64
        # doesn't care about (and doesn't work on)
      - name: 'Setup MinGW'
        if: steps.cache-i386-mingw.outputs.cache-hit != 'true'
        env:
          MINGW_LITE_PATH: '${{ steps.paths.outputs.mingw_lite }}'
        run: |
          curl -fL "https://github.com/redpanda-cpp/mingw-lite/releases/download/$MINGW_LITE_VERSION/x-mingw32_486-msvcrt_win98-$MINGW_LITE_VERSION.tar.zst" -o "$RUNNER_TEMP/mingw32.tar.zst"
          echo "$MINGW_LITE_SHA256  $RUNNER_TEMP/mingw32.tar.zst" | sha256sum -c -
          unzstd -c "$RUNNER_TEMP/mingw32.tar.zst" | tar -xf - -C "$MINGW_LITE_PATH"
          rm "$RUNNER_TEMP/mingw32.tar.zst"

          MINGW_LITE_MAJOR_VERSION="$(printf "%s\n" "$MINGW_LITE_VERSION" | sed 's/\..*//')"

          # All of the stuff we need is in separate folders AAA and AAB, with extra subdirectories
          # in each pertaining to each separate package. Thus, to get a proper prefix, we have to
          # take all of those and pull them up.
          for i in "$MINGW_LITE_PATH/mingw32_486-msvcrt_win98-$MINGW_LITE_MAJOR_VERSION"/*/; do
            for j in "$i/"*/; do
              rsync -av --remove-source-files "$j"/* "$MINGW_LITE_PATH"
            done
          done
          rm -r "$MINGW_LITE_PATH/mingw32_486-msvcrt_win98-$MINGW_LITE_MAJOR_VERSION"
          # At this point, we STILL don't have a proper prefix, because the directories
          # we actually pulled up are all under ./usr/local -- so pull them together
          mv "$MINGW_LITE_PATH/usr/local"/* "$MINGW_LITE_PATH"
          rm -r "$MINGW_LITE_PATH/usr"
          # Now MINGW_LITE_PATH is a proper prefix containing bin/ lib/ etc.

      - name: 'Add MinGW binaries to PATH'
        env:
          MINGW_LITE_PATH: '${{ steps.paths.outputs.mingw_lite }}'
        run: |
          # Err, probably also have to add the libraries too
          echo "$MINGW_LITE_PATH/bin" >> $GITHUB_PATH

      - name: 'Download SDL 2'
        if: steps.cache-i386-dependencies.outputs.cache-hit != 'true'
        env:
          PREFIX: '${{ steps.paths.outputs.prefix }}'
        run: |
          wget -O "$RUNNER_TEMP/SDL2.tar.gz" "https://libsdl.org/release/SDL2-devel-$SDL_VERSION-mingw.tar.gz"
          echo "$SDL_SHA256  $RUNNER_TEMP/SDL2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/SDL2.tar.gz" --strip-components=2 -C "$PREFIX" "SDL2-$SDL_VERSION/i686-w64-mingw32"
          rm "$RUNNER_TEMP/SDL2.tar.gz"

      - name: 'Download SDL 1.2'
        if: steps.cache-i386-dependencies.outputs.cache-hit != 'true'
        env:
          PREFIX: '${{ steps.paths.outputs.prefix }}'
        run: |
          # Largely similar to the above
          wget -O "$RUNNER_TEMP/SDL.tar.gz" "https://libsdl.org/release/SDL-devel-$SDL12_VERSION-mingw32.tar.gz"
          echo "$SDL12_SHA256  $RUNNER_TEMP/SDL.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/SDL.tar.gz" --strip-components=1 -C "$PREFIX" "SDL-$SDL12_VERSION"
          rm "$RUNNER_TEMP/SDL.tar.gz"

      - name: 'Download libflac and libogg sources'
        if: steps.cache-i386-dependencies.outputs.cache-hit != 'true'
        run: |
          wget -O libogg-$LIBOGG_VERSION.tar.xz "https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-$LIBOGG_VERSION.tar.xz" || wget -O libogg-$LIBOGG_VERSION.tar.xz "https://github.com/xiph/ogg/releases/download/v$LIBOGG_VERSION/libogg-$LIBOGG_VERSION.tar.xz"
          echo "$LIBOGG_SHA256  libogg-$LIBOGG_VERSION.tar.xz" | sha256sum -c -
          tar xf "libogg-$LIBOGG_VERSION.tar.xz"
          cd libogg-$LIBOGG_VERSION
          autoreconf -i
          cd ..

          wget -O flac-$FLAC_VERSION.tar.xz "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-$FLAC_VERSION.tar.xz" || wget -O flac-$FLAC_VERSION.tar.xz "https://github.com/xiph/flac/releases/download/$FLAC_VERSION/flac-$FLAC_VERSION.tar.xz"
          echo "$FLAC_SHA256  flac-$FLAC_VERSION.tar.xz" | sha256sum -c -
          tar xf "flac-$FLAC_VERSION.tar.xz"
          cd "flac-$FLAC_VERSION"
          patch -p1 < ../schism/.github/patches/FLAC/1-win32-revert-utime64.patch
          autoreconf -i
          cd ..

      - name: 'Build libflac'
        if: steps.cache-i386-dependencies.outputs.cache-hit != 'true'
        env:
          MINGW_LITE_PATH: '${{ steps.paths.outputs.mingw_lite }}'
          PREFIX: '${{ steps.paths.outputs.prefix }}'
        run: |
          cd libogg-$LIBOGG_VERSION
          mkdir build
          cd build
          ../configure --prefix="$PREFIX" --host="i686-w64-mingw32"
          make
          make install
          cd ../../flac-$FLAC_VERSION
          mkdir build
          cd build
          ../configure --prefix="$PREFIX" --host="i686-w64-mingw32" --with-ogg-includes="$PREFIX/include" --with-ogg-libraries="$PREFIX/lib" --disable-programs --disable-examples --disable-cpplibs
          make
          make install
          cd ../..

      - name: 'Download utf8proc'
        if: steps.cache-i386-dependencies.outputs.cache-hit != 'true'
        run: |
          wget -O "utf8proc-$UTF8PROC_VERSION.tar.gz" "https://github.com/JuliaStrings/utf8proc/releases/download/v$UTF8PROC_VERSION/utf8proc-$UTF8PROC_VERSION.tar.gz"
          echo "$UTF8PROC_SHA256  utf8proc-$UTF8PROC_VERSION.tar.gz" | sha256sum -c -
          tar xf "utf8proc-$UTF8PROC_VERSION.tar.gz"

          cd "utf8proc-$UTF8PROC_VERSION"
          patch -p1 < "../schism/.github/patches/utf8proc/3-windows.patch"
          cd ..

      - name: 'Build utf8proc'
        if: steps.cache-i386-dependencies.outputs.cache-hit != 'true'
        env:
          MINGW_LITE_PATH: '${{ steps.paths.outputs.mingw_lite }}'
          PREFIX: '${{ steps.paths.outputs.prefix }}'
        run: |
          cd utf8proc-$UTF8PROC_VERSION
          cmake -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_SYSTEM_NAME="Windows" -DCMAKE_SYSTEM_PROCESSOR="i686" -DCMAKE_C_COMPILER="i686-w64-mingw32-gcc" -DBUILD_SHARED_LIBS=1
          cmake --build build
          cmake --install build
          cd ..
        
      - name: 'Get date of latest commit'
        id: date
        run: |
          cd schism
          echo "date=$(git log -n 1 --date=short --format=format:%cd | sed 's/\(....\)-\(..\)-\(..\).*/\1\2\3/')" >> $GITHUB_OUTPUT
          cd ..

      - name: 'autoreconf'
        run: |
          cd schism
          autoreconf -i
          cd ..

      - name: 'Compile package'
        env:
          MINGW_LITE_PATH: '${{ steps.paths.outputs.mingw_lite }}'
          PREFIX: '${{ steps.paths.outputs.prefix }}'
        run: |
          cd schism
          mkdir build
          cd build
          # We link to SDL 1.2 here since it's universally supported by everything and is
          # useful as a fallback of sorts.
          CPPFLAGS="-I$PREFIX/include" LDFLAGS="-L$PREFIX/lib" UTF8PROC_CFLAGS="-I$PREFIX/include" UTF8PROC_LIBS="-L$PREFIX/lib -lutf8proc" SDL12_CFLAGS="-I$PREFIX/include/SDL" SDL12_LIBS="-L$PREFIX/lib -lSDL" FLAC_CFLAGS="-I$PREFIX/include" FLAC_LIBS="-L$PREFIX/include/lib -lFLAC -logg -lm" SDL2_CFLAGS="-I$PREFIX/include/SDL2" SDL2_LIBS="-L$PREFIX/lib -lSDL2" ../configure --with-flac --with-sdl2 --with-sdl12 --enable-sdl12-linking --without-zlib --without-bzip2 --without-lzma --host="i686-w64-mingw32"
          make
          strip schismtracker.exe
          cp schismtracker.exe ../..
          cd ../..

      - name: 'Create package'
        env:
          MINGW_LITE_PATH: '${{ steps.paths.outputs.mingw_lite }}'
          PREFIX: '${{ steps.paths.outputs.prefix }}'
        run: |
          # our build might have failed! if so, fail this part of the
          # script so that we don't silently ship packages without
          # binaries in them
          #
          # TODO can we ship zlib as well?
          test -f "schismtracker.exe"
          # This is nasty, we should *not* be doing this
          cp "$PREFIX/bin/libFLAC-14.dll" .
          cp "$PREFIX/bin/libogg-0.dll" .
          cp "$PREFIX/bin/libutf8proc.dll" .
          cp "$PREFIX/bin/SDL.dll" .
          cp "$PREFIX/bin/SDL2.dll" .
          strip "libFLAC-14.dll"
          strip "libogg-0.dll"
          strip "libutf8proc.dll"
          cp schism/docs/configuration.md schism/README.md schism/COPYING .
          wget https://raw.githubusercontent.com/xiph/flac/master/COPYING.Xiph
          unix2dos COPYING.Xiph COPYING README.md configuration.md

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: schismtracker-${{ steps.date.outputs.date }}-mingw32-i386
          path: |
            schismtracker.exe
            SDL.dll
            SDL2.dll
            libFLAC-14.dll
            libogg-0.dll
            libutf8proc.dll
            COPYING
            COPYING.Xiph
            README.md
            configuration.md

  build-others:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw32, target: x86_64, stdlib: msvcrt, cflags: '-O2', ldflags: '' }
          - { sys: mingw32, target: armv7, stdlib: msvcrt, cflags: '-O2', ldflags: '' }
          - { sys: mingw32, target: aarch64, stdlib: ucrt, cflags: '-O2', ldflags: '' }
    name: ${{ matrix.sys }}-${{ matrix.target }}
    env:
      LLVM_MINGW_VERSION: 20251118
      SDL_VERSION: 2.32.10
      SDL_SHA256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165
      SDL12_VERSION: 1.2.15
      SDL12_SHA256: d6d316a793e5e348155f0dd93b979798933fb98aa1edebcc108829d6474aad00
      FLAC_VERSION: 1.5.0
      FLAC_SHA256: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920
      LIBOGG_VERSION: 1.3.6
      LIBOGG_SHA256: 5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061
      UTF8PROC_VERSION: 2.10.0
      UTF8PROC_SHA256: 276a37dc4d1dd24d7896826a579f4439d1e5fe33603add786bb083cab802e23e
      TARGET: ${{ matrix.target }}
      SYS: ${{ matrix.sys }}
      STDLIB: ${{ matrix.stdlib }}
      CFLAGS: ${{ matrix.cflags }}
      LDFLAGS: ${{ matrix.ldflags }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          path: schism

      - name: 'Install unix2dos'
        run: |
          sudo apt-get install -y dos2unix

      - name: 'Cache llvm-mingw'
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: '/home/runner/llvm-mingw'
          key: windows-${{ matrix.stdlib }}-llvm-mingw-${{ env.LLVM_MINGW_VERSION }}

      - name: 'Cache dependencies'
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: '/home/runner/prefix'
          key: windows-${{ matrix.sys }}-${{ matrix.target }}-${{ matrix.stdlib }}-dependencies-SDL_${{ env.SDL_VERSION }}-SDL12_${{ env.SDL12_VERSION }}-FLAC_${{ env.FLAC_VERSION }}-LIBOGG_${{ env.LIBOGG_VERSION }}-UTF8PROC_${{ env.UTF8PROC_VERSION }}

      - name: 'Grab llvm-mingw'
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          # FIXME need sha256 hash
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-$STDLIB-ubuntu-22.04-x86_64.tar.xz" | tar xJvf - -C "$HOME"
          mv "$HOME/llvm-mingw-$LLVM_MINGW_VERSION-$STDLIB-ubuntu-22.04-x86_64" "$HOME/llvm-mingw"

      - name: 'Download SDL2 sources'
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          wget -O "SDL2-$SDL_VERSION.tar.gz" https://www.libsdl.org/release/SDL2-$SDL_VERSION.tar.gz || wget -O "SDL2-$SDL_VERSION.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.tar.gz
          echo "$SDL_SHA256  SDL2-$SDL_VERSION.tar.gz" | sha256sum -c -
          tar xf "SDL2-$SDL_VERSION.tar.gz"

      - name: 'Build SDL2'
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/llvm-mingw/bin:$PATH"
          cd SDL2-$SDL_VERSION
          ./configure --host="$TARGET-w64-$SYS" --prefix="$HOME/prefix"
          make
          make install
          cd ..

      - name: 'Download libflac and libogg sources'
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          wget -O libogg-$LIBOGG_VERSION.tar.xz "https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-$LIBOGG_VERSION.tar.xz" || wget -O libogg-$LIBOGG_VERSION.tar.xz "https://github.com/xiph/ogg/releases/download/v$LIBOGG_VERSION/libogg-$LIBOGG_VERSION.tar.xz"
          echo "$LIBOGG_SHA256  libogg-$LIBOGG_VERSION.tar.xz" | sha256sum -c -
          tar xf "libogg-$LIBOGG_VERSION.tar.xz"

          wget -O flac-$FLAC_VERSION.tar.xz "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-$FLAC_VERSION.tar.xz" || wget -O flac-$FLAC_VERSION.tar.xz "https://github.com/xiph/flac/releases/download/$FLAC_VERSION/flac-$FLAC_VERSION.tar.xz"
          echo "$FLAC_SHA256  flac-$FLAC_VERSION.tar.xz" | sha256sum -c -
          tar xf "flac-$FLAC_VERSION.tar.xz"

      - name: 'Build libflac'
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/llvm-mingw/bin:$PATH"
          cd libogg-$LIBOGG_VERSION
          mkdir build
          cd build
          ../configure --host="$TARGET-w64-$SYS" --prefix="$HOME/prefix"
          make
          make install
          cd ../../flac-$FLAC_VERSION
          mkdir build
          cd build
          ../configure --host="$TARGET-w64-$SYS" --prefix="$HOME/prefix" --disable-programs --disable-examples --disable-cpplibs
          make
          make install
          cd ../..

      - name: 'Download utf8proc'
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          wget -O "utf8proc-$UTF8PROC_VERSION.tar.gz" "https://github.com/JuliaStrings/utf8proc/releases/download/v$UTF8PROC_VERSION/utf8proc-$UTF8PROC_VERSION.tar.gz"
          echo "$UTF8PROC_SHA256  utf8proc-$UTF8PROC_VERSION.tar.gz" | sha256sum -c -
          tar xf "utf8proc-$UTF8PROC_VERSION.tar.gz"

      - name: 'Build utf8proc'
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/llvm-mingw/bin:$PATH"
          cd utf8proc-$UTF8PROC_VERSION
          mkdir build
          cd build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE="Release" -DCMAKE_INSTALL_PREFIX="$HOME/prefix" -DCMAKE_C_COMPILER="$TARGET-w64-$SYS-clang" -DCMAKE_SYSTEM_NAME="Windows"
          make
          make install
          cd ../..

        # TODO build zlib here too

      - name: 'Get date of latest commit'
        id: date
        run: |
          cd schism
          echo "date=$(git log -n 1 --date=short --format=format:%cd | sed 's/\(....\)-\(..\)-\(..\).*/\1\2\3/')" >> $GITHUB_OUTPUT
          cd ..

      - name: 'Build package'
        run: |
          export PATH="$HOME/llvm-mingw/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$HOME/prefix/lib/pkgconfig"
          cd schism
          autoreconf -I"$HOME/prefix/share/aclocal" -i
          mkdir build
          cd build
          # Link to SDL2, since it's the only backend we support here
          ../configure --host="$TARGET-w64-$SYS" --prefix="$HOME/prefix" --with-flac --with-sdl2 --without-zlib --enable-sdl2-linking
          make
          "$TARGET-w64-$SYS-strip" -g schismtracker.exe
          cp schismtracker.exe ../..
          cd ../..
          cp "$HOME/prefix/bin/SDL2.dll" .
          cp "$HOME/prefix/bin/libFLAC-14.dll" .
          cp "$HOME/prefix/bin/libogg-0.dll" .
          cp "$HOME/llvm-mingw/$TARGET-w64-$SYS/bin/libwinpthread-1.dll" .
          "$TARGET-w64-$SYS-strip" -g "SDL2.dll"
          "$TARGET-w64-$SYS-strip" -g "libFLAC-14.dll"
          "$TARGET-w64-$SYS-strip" -g "libogg-0.dll"
          "$TARGET-w64-$SYS-strip" -g "libwinpthread-1.dll"
          cp schism/docs/configuration.md schism/README.md schism/COPYING .
          wget https://raw.githubusercontent.com/xiph/flac/master/COPYING.Xiph
          unix2dos COPYING.Xiph COPYING README.md configuration.md

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: schismtracker-${{ steps.date.outputs.date }}-${{ matrix.sys }}-${{ matrix.target }}
          path: |
            schismtracker.exe
            SDL2.dll
            libFLAC-14.dll
            libogg-0.dll
            libwinpthread-1.dll
            COPYING
            COPYING.Xiph
            README.md
            configuration.md

  test:
    strategy:
      fail-fast: false
      matrix:
        threads: [
          { flag: '--disable-threads', name: '' },
          { flag: '--enable-threads', name: '-threaded' },
        ]
        sys: [
          # MSYS2 doesn't make new 32-bit packages anymore. Now what?
          { sys: mingw64, env: x86_64 },
          { sys: ucrt64,  env: ucrt-x86_64 },
        ]
        backend: [
          { name: 'sdl12', pkgsuf: 'SDL'  },
          { name: 'sdl2',  pkgsuf: 'SDL2' },
          { name: 'sdl3',  pkgsuf: 'sdl3' },
        ]
        link: [
          { name: 'linked', flag: true },
          { name: 'loaded', flag: false },
        ]
        os: [ windows-2022, windows-2025 ]
    runs-on: ${{matrix.os}}
    concurrency:
      group: ${{github.ref}}-${{github.workflow}}-${{matrix.os}}-${{matrix.sys.sys}}-${{matrix.sys.env}}${{matrix.threads.name}}-${{matrix.backend.name}}-${{matrix.link.name}}
      cancel-in-progress: true
    #name: ${{matrix.sys.sys}}-${{matrix.sys.env}} # the default name will work just fine
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2

      - name: 'Setup MSYS2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys.sys }}
          update: true
          install: mingw-w64-${{ matrix.sys.env }}-toolchain libtool autoconf automake make mingw-w64-${{ matrix.sys.env }}-${{ matrix.backend.pkgsuf }} mingw-w64-${{ matrix.sys.env }}-libutf8proc mingw-w64-${{ matrix.sys.env }}-zlib zip dos2unix

      - name: 'Build package'
        env:
          CONFIGURE_FLAGS: ${{ matrix.threads.flag }}
        run: |
          autoreconf -i
          mkdir build
          cd build
          ../configure --enable-tests $CONFIGURE_FLAGS --with-${{ matrix.backend.name }} '${{ matrix.link.flag && format('--enable-{0}-linking', matrix.backend.name) || '' }}'
          make

      - name: 'Run test suite'
        run: |
          cd build
          ./schismtrackertest.exe
